<script type="text/javascript">
(function () {
  const STYLE_MAP = {
    "+": "cd-add",
    "-": "cd-rem",
    "!": "cd-chg",
    "#": "cd-note",
    "@": "cd-hi"
  };

  // Parse one step's payload, e.g. "+:2-3,-:5,!:7"
  // Returns an array of { cls, from, to }.
  function parseStep(payload) {
    const out = [];
    if (!payload) return out;
    for (const seg of payload.split(",")) {
      const s = seg.trim();
      if (!s) continue;
      const m = s.match(/^([+\-!#@]):(\d+)(?:-(\d+))?$/);
      if (!m) {
        console.warn("[code-line-diff] cannot parse segment:", s);
        continue;
      }
      const cls = STYLE_MAP[m[1]];
      const from = parseInt(m[2], 10);
      const to = m[3] ? parseInt(m[3], 10) : from;
      out.push({ cls, from, to });
    }
    return out;
  }

  // Map YAML-form keys to marker characters.
  const KEY_TO_MARKER = {
    add: "+", rem: "-", chg: "!", note: "#", hi: "@"
  };

  // Parse a single YAML step: either a mapping like {add: "2-3", rem: 5}
  // or a single-key shortcut. Returns an array of { cls, from, to }.
  function parseYamlStep(item) {
    const out = [];
    if (item == null || typeof item !== "object") return out;
    for (const [key, val] of Object.entries(item)) {
      const marker = KEY_TO_MARKER[key];
      if (!marker) {
        console.warn("[code-line-diff] unknown key:", key);
        continue;
      }
      const cls = STYLE_MAP[marker];
      // value may be "2-3", "2", or a number.
      const s = String(val).trim();
      const m = s.match(/^(\d+)(?:-(\d+))?$/);
      if (!m) {
        console.warn("[code-line-diff] cannot parse range:", s);
        continue;
      }
      const from = parseInt(m[1], 10);
      const to = m[2] ? parseInt(m[2], 10) : from;
      out.push({ cls, from, to });
    }
    return out;
  }

  // Parse the full attribute. Returns an array of steps (each step is an array of ranges).
  // Two forms:
  //   1. Compact string: "|@:2|-:3,+:4-7" (pipe-separated steps)
  //   2. JSON (from Quarto YAML cell options): "[{\"add\":\"2-3\"},{\"rem\":5}]" — one step per array entry
  function parseSpec(spec) {
    if (!spec) return [];
    const trimmed = spec.trim();
    if (trimmed.startsWith("[") || trimmed.startsWith("{")) {
      try {
        const parsed = JSON.parse(trimmed);
        const arr = Array.isArray(parsed) ? parsed : [parsed];
        return arr.map(parseYamlStep);
      } catch (e) {
        console.warn("[code-line-diff] invalid JSON spec:", trimmed, e);
        return [];
      }
    }
    return trimmed.split("|").map(parseStep);
  }

  // Find the line elements inside a <pre><code>...</code></pre> block.
  // Pandoc/Quarto wraps each line in <span id="cb1-1">…</span>\n by default,
  // or sometimes with <a> anchors when line numbers are on.
  function getLineEls(codeEl) {
    // Prefer direct children spans that look like line wrappers.
    const spans = codeEl.querySelectorAll(":scope > span[id]");
    if (spans.length) return Array.from(spans);
    // Fallback: split by newline children — not ideal, but a safety net.
    return [];
  }

  function applyStatic(codeEl, ranges) {
    const lines = getLineEls(codeEl);
    for (const { cls, from, to } of ranges) {
      for (let i = from; i <= to; i++) {
        const el = lines[i - 1];
        if (el) el.classList.add(cls);
      }
    }
  }

  // Wire up to reveal.js fragments for progressive reveal.
  function applyProgressive(preEl, codeEl, steps) {
    const lines = getLineEls(codeEl);
    // step 0 = initial state. We add a fragment per *additional* step.
    // Each fragment, when shown, sets the classes for that step (and clears prior).
    const applyStep = (idx) => {
      // Clear all diff classes
      for (const el of lines) {
        el.classList.remove("cd-add", "cd-rem", "cd-chg", "cd-note", "cd-hi");
      }
      for (let s = 0; s <= idx; s++) {
        // For "replace as you go" semantics, apply only current step.
        // Switch to single-step if you prefer cumulative.
      }
      // Cumulative semantics feels closer to code-line-numbers progressive:
      // each "|" *replaces* the highlight. Match that.
      const ranges = steps[idx] || [];
      for (const { cls, from, to } of ranges) {
        for (let i = from; i <= to; i++) {
          const el = lines[i - 1];
          if (el) el.classList.add(cls);
        }
      }
    };

    // Apply step 0 immediately.
    applyStep(0);

    // For each subsequent step, attach an invisible fragment that triggers the swap.
    for (let i = 1; i < steps.length; i++) {
      const frag = document.createElement("span");
      frag.className = "fragment cd-step";
      frag.setAttribute("data-cd-step", String(i));
      frag.style.display = "none";
      preEl.appendChild(frag);
    }

    // Listen for fragment events from reveal.
    if (window.Reveal) {
      const handler = (e) => {
        if (!preEl.contains(e.fragment)) return;
        const idx = parseInt(e.fragment.getAttribute("data-cd-step") || "0", 10);
        if (e.type === "fragmentshown") applyStep(idx);
        if (e.type === "fragmenthidden") applyStep(idx - 1);
      };
      window.Reveal.on("fragmentshown", handler);
      window.Reveal.on("fragmenthidden", handler);
    }
  }

  function process() {
    const blocks = document.querySelectorAll("pre > code, div.sourceCode pre > code");
    blocks.forEach((codeEl) => {
      const preEl = codeEl.parentElement;
      // The attribute is usually placed on the outer wrapper by Pandoc.
      const wrapper = preEl.closest("[data-code-line-diff]") || preEl;
      const spec = wrapper.getAttribute("data-code-line-diff") ||
                   preEl.getAttribute("data-code-line-diff") ||
                   codeEl.getAttribute("data-code-line-diff");
      if (!spec) return;

      const steps = parseSpec(spec);
      if (steps.length === 0) return;

      if (steps.length === 1) {
        applyStatic(codeEl, steps[0]);
      } else {
        applyProgressive(preEl, codeEl, steps);
      }
    });
  }

  if (window.Reveal) {
    if (window.Reveal.isReady && window.Reveal.isReady()) process();
    else window.Reveal.on("ready", process);
  } else {
    document.addEventListener("DOMContentLoaded", process);
  }
})();
</script>
